<!DOCTYPE html>
<html>
<head>
  <title>ESP32 BLE LED Control</title>
</head>
<body>
  <h2>BLE Điều khiển đèn ESP32</h2>
  <button onclick="connectBLE()">🔗 Kết nối ESP32</button>
  <hr>
  <div>
    <h3>LED1 (GPIO25)</h3>
    <button onclick="sendCommand('LED1_ON')">Bật</button>
    <button onclick="sendCommand('LED1_OFF')">Tắt</button>
  </div>
  <div>
    <h3>LED2 (GPIO26)</h3>
    <button onclick="sendCommand('LED2_ON')">Bật</button>
    <button onclick="sendCommand('LED2_OFF')">Tắt</button>
  </div>
  <div>
    <h3>LED3 (GPIO27)</h3>
    <button onclick="sendCommand('LED3_ON')">Bật</button>
    <button onclick="sendCommand('LED3_OFF')">Tắt</button>
  </div>

  <script>
    let bleDevice, bleCharacteristic;
    const SERVICE_UUID = "d82ce91a-23c7-454a-8f48-3c799707c217";
    const CHARACTERISTIC_UUID = "ff02a2fe-332e-4a54-a270-ccb8d9ee50dc";
    
    async function connectBLE() {
      try {
        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [{ name: "ESP32_BLE_Control" }],
          optionalServices: [SERVICE_UUID]
        });

        const server = await bleDevice.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        bleCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

        alert("✅ Đã kết nối ESP32!");
      } catch (error) {
        alert("❌ Lỗi kết nối BLE: " + error);
      }
    }

    async function sendCommand(command) {
      if (!bleCharacteristic) {
        alert("⚠️ Chưa kết nối thiết bị!");
        return;
      }

      const encoder = new TextEncoder();
      await bleCharacteristic.writeValue(encoder.encode(command));
      console.log("Sent command: " + command);
    }
  </script>
</body>
</html>
