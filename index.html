<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Điều khiển Relay qua BLE</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", sans-serif;
      background-image: url("anh-truong.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: white;
      text-align: center;
    }

    .container {
      background: rgba(0, 0, 0, 0.6);
      margin: 50px auto;
      padding: 30px;
      border-radius: 15px;
      max-width: 400px;
    }

    h1 {
      margin-bottom: 20px;
    }

    button {
      width: 140px;
      height: 50px;
      margin: 10px auto;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.3s;
      display: block;
    }

    .on-btn {
      background-color: #4CAF50;
      color: white;
    }

    .on-btn:hover {
      background-color: #45a049;
    }

    .off-btn {
      background-color: #f44336;
      color: white;
    }

    .off-btn:hover {
      background-color: #e53935;
    }

    #connect-btn {
      background-color: #2196F3;
      color: white;
      margin-bottom: 30px;
    }

    #connect-btn:hover {
      background-color: #1976D2;
    }

    .section {
      margin: 25px 0;
    }

    hr {
      border: none;
      height: 1px;
      background-color: #555;
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>PHẦN MỀM ĐIỀU KHIỂN</h1>

    <button id="connect-btn" onclick="connectBLE()">Kết nối Bluetooth</button>

    <div class="section">
      <h2>Mức 1</h2>
      <button class="on-btn" onclick="turnOnOnly('RELAY1_ON')">BẬT</button>
    </div>

    <div class="section">
      <h2>Mức 2</h2>
      <button class="on-btn" onclick="turnOnOnly('RELAY2_ON')">BẬT</button>
    </div>

    <div class="section">
      <h2>Mức 3</h2>
      <button class="on-btn" onclick="turnOnOnly('RELAY3_ON')">BẬT</button>
    </div>

    <hr>

    <div class="section">
      <h2>TẮT</h2>
      <button class="off-btn" onclick="turnOffAll()">TẮT</button>
    </div>
  </div>

  <script>
    let bleDevice, bleCharacteristic;

    const SERVICE_UUID = "d82ce91a-23c7-454a-8f48-3c799707c217";
    const CHARACTERISTIC_UUID = "ff02a2fe-332e-4a54-a270-ccb8d9ee50dc";

    async function connectBLE() {
      try {
        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [{ name: "ESP32_BLE_Relay" }],
          optionalServices: [SERVICE_UUID]
        });

        const server = await bleDevice.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        bleCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

        alert("Đã kết nối thành công!");
      } catch (error) {
        alert("Lỗi kết nối: " + error);
      }
    }

    async function sendCommand(command) {
      if (!bleCharacteristic) {
        alert("Chưa kết nối");
        return;
      }

      const encoder = new TextEncoder();
      await bleCharacteristic.writeValue(encoder.encode(command));
      console.log("Đã gửi:", command);
    }

    function turnOnOnly(command) {
      sendCommand(command);
    }

    async function turnOffAll() {
      await sendCommand("RELAY_ALL_OFF");
      
      // Backup: tắt từng relay với delay nếu lệnh trên không hoạt động
      await new Promise(resolve => setTimeout(resolve, 50));
      await sendCommand("RELAY1_OFF");
      await new Promise(resolve => setTimeout(resolve, 50));
      await sendCommand("RELAY2_OFF");
      await new Promise(resolve => setTimeout(resolve, 50));
      await sendCommand("RELAY3_OFF");
    }
  </script>
</body>
</html>
